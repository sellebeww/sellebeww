<svg xmlns="http://www.w3.org/2000/svg" width="238" height="82" viewBox="0 0 238 82" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Spotify</title>
  <desc id="desc">Spotify profile — My soundtrack</desc><style>

