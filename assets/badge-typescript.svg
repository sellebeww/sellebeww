<svg xmlns="http://www.w3.org/2000/svg" width="133" height="34" viewBox="0 0 133 34" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript</title>
  <desc id="desc">TypeScript toolkit badge</desc><style>

    .badge-shine { animation: shine 8s ease-in-out 0.5s infinite; }
