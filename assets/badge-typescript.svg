    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><clipPath id="badge-clip"><rect x=".5" y=".5" width="132" height="33" rx="9"/></clipPath></defs>
  <rect x=".5" y=".5" width="132" height="33" rx="9" fill="#E5EDFF" stroke="#4976C0" stroke-opacity=".3"/>
  <rect x="6" y="6" width="22" height="22" rx="6" fill="#4976C0"/>
  <text x="17" y="21" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="700">TS</text>
  <text x="36" y="22" fill="#342543" font-family="Arial, sans-serif" font-size="13" font-weight="600">TypeScript</text>
  <g clip-path="url(#badge-clip)"><path class="badge-shine" d="M-14 0H0l17 34H3Z" fill="#FFFFFF" opacity="0"/></g>
</svg>
